<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Chess (C → WASM)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
</head>
<body>
  <h1>Chess (C → WebAssembly)</h1>
  <button id="btn-add">Test add(40,2)</button>
  <button id="btn-move">best_move(FEN initial)</button>
  <pre id="out"></pre>

  <script src="/chess.js"></script>
  <script>
    const waitReady = new Promise((resolve) => {
      const check = () => (typeof Module !== 'undefined' && Module.calledRun) ? resolve(Module) : setTimeout(check, 50);
      check();
    });

    (async () => {
      const mod = await waitReady;
      const c_add  = mod.cwrap('add', 'number', ['number','number']);
      const c_best = mod.cwrap('best_move', 'string', ['string']);

      document.getElementById('btn-add').onclick = () => {
        const r = c_add(40, 2);
        document.getElementById('out').textContent += `add(40,2) = ${r}\n`;
      };

      const START_FEN = "rn1qkbnr/ppp1pppp/8/3p4/3P4/5N2/PPPBPPPP/RN1QKB1R w KQkq - 0 1";
      document.getElementById('btn-move').onclick = () => {
        const mv = c_best(START_FEN);
        document.getElementById('out').textContent += `best_move → ${mv}\n`;
      };
    })();
  </script>
</body>
</html>
